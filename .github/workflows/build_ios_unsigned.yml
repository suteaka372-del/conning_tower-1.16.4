# 署名なしのIPAを作るワークフロー
# Actionsタブ → "Build iOS (unsigned IPA)" → "Run workflow" で実行し、
# 終わったら実行結果ページ下部の Artifacts から IPA(zip) をダウンロードする。
# iPhoneへは Sideloadly / AltStore などで自分のApple IDで署名してインストールする。
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version-file: pubspec.yaml

      - run: flutter pub get

      - name: dart run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ConningTower-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ConningTower-unsigned-ipa
          path: ConningTower-unsigned.ipa
